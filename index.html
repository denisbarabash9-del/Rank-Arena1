function pickFromBag(kind,count){
 let state=bags[kind]||{bag:[],last:-1};
 try{const saved=JSON.parse(localStorage.getItem('retro_ranked_bag_'+kind));if(saved)state=saved}catch(e){}
 if(!Array.isArray(state.bag)||state.bag.some(v=>!Number.isInteger(v)||v<0||v>=count))state.bag=[];
 if(!state.bag.length){state.bag=Array.from({length:count},(_,i)=>i);for(let i=state.bag.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[state.bag[i],state.bag[j]]=[state.bag[j],state.bag[i]];}if(state.bag[0]===state.last&&count>1)[state.bag[0],state.bag[1]]=[state.bag[1],state.bag[0]];}
 const result=state.bag.shift();state.last=result;
 bags[kind]={bag:[...state.bag],last:state.last};
 try{localStorage.setItem('retro_ranked_bag_'+kind,JSON.stringify(state))}catch(e){}
 return result;
}

function tacticScore(heroId,foes,mates){
 const hero=heroes[heroId],cl=hero.cls,map=MAPS[mapIndex],fav=MODE_DATA[modeIndex].fav;
 let score=scoreCounter(hero,foes)*3;
 score+=fav.includes(cl)?3:0;
 const matchClasses=mates.map(i=>heroes[i].cls),dups=matchClasses.filter(x=>x===cl).length;
 score-=dups*2.9;
 if(cl==='ПОДДЕРЖКА'&&matchClasses.includes('ТАНК'))score+=3.5;
 if(cl==='ТАНК'&&matchClasses.includes('ПОДДЕРЖКА'))score+=3;
 if(cl==='МЕТАТЕЛЬ'&&map.walls.length>=8)score+=2.2;
 if(cl==='УБИЙЦА'&&map.bushes.length>=6)score+=2;
 if(cl==='СТРЕЛОК'&&map.walls.length<=8)score+=1.5;
 if(foes.some(n=>heroes[n].cls==='ТАНК')&&['МЕТАТЕЛЬ','УРОН'].includes(cl))score+=1.2;
 if(matchClasses.length===1&&!matchClasses.includes('ТАНК')&&cl==='ТАНК')score+=1.2;
 return score;
}

 }

 const delta={x:point.x-base.x,y:point.y-base.y};
 if(Math.hypot(delta.x,delta.y)>15)return norm(delta.x,delta.y);
 const enemy=closestEnemy(a);
 // Tapping the center auto-aims at the nearest enemy when available.

}
function aimWorld(a,point){return norm(point.x-a.x,point.y-a.y)}
function dragDistance(point,kind,a){const base=kind==='super'?{x:965,y:588}:{x:1127,y:546};const d=Math.hypot(point.x-base.x,point.y-base.y);const max=aimDistance(a,kind);return d<15?max:Math.max(45,Math.min(max,max*(d/105)));}
function aimDistance(a,kind){
 if(kind==='fire')return heroes[a.type].range;
 return [350,590,360,370,125,110,360,240,295,300,385,290,85,220,250,440,195,100,285,385,175,75,260,198][a.type];
}
function drawAimPreview(p){
 if(!p||!p.alive||match.phase!=='play')return;
 const isSuper=controls.superId!==null;
 if(!isSuper&&controls.fireId===null&&controls.mouseAimId===null)return;
 const dir=isSuper?controls.superAim:controls.fire;
 const h=heroes[p.type],distance=(isSuper?controls.superDistance:controls.fireDistance)??aimDistance(p,isSuper?'super':'fire');
 const col=isSuper?'#ffdf62':'#e1f8ff';
 c.save();c.beginPath();c.rect(FIELD.left,FIELD.top,FIELD.right-FIELD.left,FIELD.bottom);c.clip();
 // Reveal the effective area for non-directional supers.
 const circleSuper=isSuper&&[6,12,19,21].includes(p.type);
 if(circleSuper){
   c.beginPath();c.arc(p.x,p.y,distance,0,TAU);
   c.fillStyle='rgba(255,222,100,.08)';c.fill();c.strokeStyle='#ffe06f';c.lineWidth=3;c.setLineDash([12,9]);c.stroke();c.setLineDash([]);
   text('УЛЬТА — ОБЛАСТЬ ДЕЙСТВИЯ',p.x,p.y-distance-13,13,'#ffefad','center');
 }else{
   const angle=Math.atan2(dir.y,dir.x),wide=!isSuper&&[0,2,5,6,7].includes(p.type)?.36:0.05;
   if(wide>.1){
     c.beginPath();c.moveTo(p.x,p.y);c.arc(p.x,p.y,distance,angle-wide,angle+wide);c.closePath();
     c.fillStyle=isSuper?'rgba(255,219,86,.19)':'rgba(221,249,255,.13)';c.fill();
   }
   let len=distance;
   const isLob=!isSuper&&[8,9].includes(p.type);
   // Straight projectiles stop at walls; lobs land behind walls.
   for(let d=14;!isLob&&d<=distance;d+=11){
     const x=p.x+dir.x*d,y=p.y+dir.y*d;
     if(x<FIELD.left||x>FIELD.right||y<FIELD.top||y>FIELD.bottom||walls.some(w=>circleRect(x,y,5,w))){len=d-11;break}
   }
   len=Math.max(0,len);
   const ex=p.x+dir.x*len,ey=p.y+dir.y*len;
   c.beginPath();c.moveTo(p.x,p.y);if(isLob)c.quadraticCurveTo((p.x+ex)/2,(p.y+ey)/2-72,ex,ey);else c.lineTo(ex,ey);
   c.strokeStyle=col;c.lineWidth=isSuper?5:3;c.globalAlpha=.9;c.setLineDash([15,9]);c.stroke();c.setLineDash([]);
   c.beginPath();c.arc(ex,ey,isLob?55:isSuper?(p.type===5?39:24):17,0,TAU);
   c.fillStyle=isSuper?'#ffe46324':'#dff9ff21';c.fill();c.strokeStyle=col;c.lineWidth=3;c.stroke();
   c.beginPath();c.moveTo(ex-11,ey);c.lineTo(ex+11,ey);c.moveTo(ex,ey-11);c.lineTo(ex,ey+11);c.stroke();
 }
 c.restore();
 text(isSuper?'ОТПУСТИ: УЛЬТА':'ОТПУСТИ: ВЫСТРЕЛ',850,451,17,isSuper?'#ffe17b':'#d6f7ff','center',900,true);
}
function drawControls(p){
 const ml=controls.moveId!==null,fl=controls.fireId!==null,sl=controls.superId!==null;
 const bx=144,by=552,ex=1127,ey=546,sx=965,sy=588;
 ellipse(bx,by,92,92,'#111638b2');
 c.beginPath();c.arc(bx,by,88,0,TAU);c.strokeStyle='#a5d2ff55';c.lineWidth=4;c.stroke();
 ellipse(bx+controls.move.x*48,by+controls.move.y*48,40,40,ml?'#8fd0ffac':'#7186b46b');
 ellipse(ex,ey,79,79,p.ammo<1?'#24264099':fl?'#79344fbb':'#511e4a91');
 c.beginPath();c.arc(ex,ey,77,0,TAU);c.strokeStyle=fl?'#ffebdf':'#ff9ca4a0';c.lineWidth=fl?6:4;c.stroke();
 const fx=ex+(fl?controls.fire.x*36:0),fy=ey+(fl?controls.fire.y*36:0);
 ellipse(fx,fy,38,38,p.ammo<1?'#70718c':fl?'#ffe4ba':'#ec7189');text('➤',fx,fy-1,36,'#631d36','center',1000);
 ellipse(sx,sy,49,49,sl?'#ffe995':p.sup>=100?'#fbd44a':'#584b82');
 if(sl){c.beginPath();c.arc(sx,sy,49,0,TAU);c.strokeStyle='#fff2bc';c.lineWidth=6;c.stroke()}
 const ux=sx+(sl?controls.superAim.x*19:0),uy=sy+(sl?controls.superAim.y*19:0);
 star(ux,uy,25,sl?'#fff6c2':p.sup>=100?'#fff7a0':'#ab9ad7');
 text(Math.floor(p.sup)+'%',sx,627,13,'#fff','center');
 rr(16,27,38,38,8,'#1d1b44','#7884b0');text('Ⅱ',35,47,22,'#fff','center');
}
function resetPointers(){controls.moveId=null;controls.fireId=null;controls.superId=null;controls.mouseAimId=null;controls.move={x:0,y:0};controls.fireDistance=null;controls.superDistance=null}
let keys=new Set(),mouse={x:0,y:0};
const controls={moveId:null,fireId:null,superId:null,mouseAimId:null,move:{x:0,y:0},fire:{x:1,y:0},superAim:{x:1,y:0},fireDistance:null,superDistance:null};
function pointerPos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function controlUpdate(id,p){
 if(id===controls.moveId){
   let dx=p.x-144,dy=p.y-552,len=Math.hypot(dx,dy),v=Math.min(len/67,1);
   controls.move=norm(dx,dy);controls.move.x*=v;controls.move.y*=v;
 }else if(id===controls.fireId){
   controls.fire=aimFor(match.actors[0],'fire',p);controls.fireDistance=dragDistance(p,'fire',match.actors[0]);
 }else if(id===controls.superId){
   controls.superAim=aimFor(match.actors[0],'super',p);controls.superDistance=dragDistance(p,'super',match.actors[0]);
 }else if(id===controls.mouseAimId){
   controls.fire=aimWorld(match.actors[0],{x:p.x,y:p.y-132+cameraY});controls.fireDistance=Math.min(heroes[match.actors[0].type].range,Math.hypot(p.x-match.actors[0].x,p.y-132+cameraY-match.actors[0].y));
 }
}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();cv.setPointerCapture(e.pointerId);
 let p=pointerPos(e);
 if(screen!=='battle'){
   for(let i=buttonRects.length-1;i>=0;i--){let b=buttonRects[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.action();break}}
   return;
 }
 if(p.x<59&&p.y<89){screen='menu';resetPointers();return}
 const player=match.actors[0];if(!player.alive||match.phase!=='play')return;
 if(Math.hypot(p.x-965,p.y-588)<59&&controls.superId===null){
   controls.superId=e.pointerId;controls.superAim=aimFor(player,'super',p);
 }else if(Math.hypot(p.x-1127,p.y-546)<96&&controls.fireId===null){
   controls.fireId=e.pointerId;controls.fire=aimFor(player,'fire',p);
 }else if(p.x<420&&controls.moveId===null){
   controls.moveId=e.pointerId;controlUpdate(e.pointerId,p);
 }else if(e.pointerType==='mouse'&&p.y<510&&controls.mouseAimId===null){
   controls.mouseAimId=e.pointerId;controls.fire=aimWorld(player,p);
 }
});
cv.addEventListener('pointermove',e=>{
 const p=pointerPos(e);if(screen==='battle'&&match)controlUpdate(e.pointerId,p);
 let h=-1;buttonRects.forEach((b,i)=>{if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)h=i});hover=h;
});
function pointerUp(e){
 // Canceled gestures or pointer loss must not fire.
 const release=e.type==='pointerup',p=pointerPos(e);
 if(screen==='battle'&&match&&match.phase==='play'){
   const player=match.actors[0];
   if(player.alive&&release){
     if(e.pointerId===controls.fireId||e.pointerId===controls.mouseAimId){
       controlUpdate(e.pointerId,p);player.aim={...controls.fire};shoot(player,player.aim,false,controls.fireDistance);
     }else if(e.pointerId===controls.superId){
       controlUpdate(e.pointerId,p);player.aim={...controls.superAim};player.chosenSuperDistance=controls.superDistance;superPower(player);player.chosenSuperDistance=null;
     }
   }
 }
 if(e.pointerId===controls.moveId){controls.moveId=null;controls.move={x:0,y:0};controls.fireDistance=null;controls.superDistance=null}
 if(e.pointerId===controls.fireId){controls.fireId=null;controls.fireDistance=null;}
 if(e.pointerId===controls.superId){controls.superId=null;controls.superDistance=null;}
 if(e.pointerId===controls.mouseAimId){controls.mouseAimId=null;controls.fireDistance=null;}
}
cv.addEventListener('pointerup',pointerUp);cv.addEventListener('pointercancel',pointerUp);
window.addEventListener('keydown',e=>{
 let k=e.key.toLowerCase();keys.add(k);
 if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();
 if(k==='escape'&&(screen==='battle'||screen==='draft'||screen==='pass')){screen='menu';resetPointers()}
 if(k==='enter'&&screen==='menu')beginDraft();
 if(k==='r'&&screen==='result')beginDraft();
 if(e.repeat||screen!=='battle'||!match||match.phase!=='play')return;
 const a=match.actors[0];if(!a.alive)return;
 if(k===' '||k==='k'){
   const target=closestEnemy(a);if(target)a.aim=norm(target.x-a.x,target.y-a.y);
   superPower(a);
 }else if(k==='j'){
   const target=closestEnemy(a);if(target)a.aim=norm(target.x-a.x,target.y-a.y);
   shoot(a,a.aim);
 }
});
window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{keys.clear();resetPointers()});
function frame(t){let dt=last?Math.min(.042,(t-last)/1000):.016;last=t;c.setTransform(scaleX,0,0,scaleY,0,0);c.clearRect(0,0,W,H);buttonRects=[];advance(dt);if(screen==='menu')menuDraw();else if(screen==='draft')draftDraw();else if(screen==='pass')passDraw();else if(screen==='battle')drawCombat();else if(screen==='result')resultDraw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
</script></body></html>
